<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Glyph Clock - Banyue</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            font-family: sans-serif;
        }

        .glyph-btn {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* --- CONTENITORI PAGINE --- */
        .page {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .glyph-svg {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
        }

        /* Gestione Stili dei Tracciati SVG */
        .glyph-svg path {
            stroke: #333333;
            stroke-dasharray: var(--len, 2000);
            stroke-dashoffset: var(--len, 2000);
            transition: stroke-dashoffset 0.7s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
        }

        /* Limitato alla pagina 1: altrimenti disegnerebbe subito anche Banyue,
           annullando il suo effetto disegno (.banyue-svg.drawn) */
        .glyph-btn.active .page-1 .glyph-svg path {
            stroke: #FFFFFF;
            stroke-dashoffset: 0;
        }

        /* Stasamento temporale a cascata */
        .glyph-svg path:nth-child(1) {
            transition-delay: 0.00s;
        }

        .glyph-svg path:nth-child(2) {
            transition-delay: 0.04s;
        }

        .glyph-svg path:nth-child(3) {
            transition-delay: 0.08s;
        }

        .glyph-svg path:nth-child(4) {
            transition-delay: 0.12s;
        }

        .glyph-svg path:nth-child(5) {
            transition-delay: 0.16s;
        }

        .glyph-svg path:nth-child(6) {
            transition-delay: 0.20s;
        }

        .glyph-svg path:nth-child(7) {
            transition-delay: 0.24s;
        }

        .glyph-svg path:nth-child(8) {
            transition-delay: 0.28s;
        }

        .glyph-svg path:nth-child(9) {
            transition-delay: 0.32s;
        }

        /* --- ANIMAZIONE TRANSIZIONE PAGINA 1 -> PAGINA 2 --- */
        .page-1.exit .glyph-svg {
            transform: translateY(-100vh);
        }

        .page-1.exit .glyph-svg path {
            stroke-dashoffset: var(--len, 2000) !important;
        }

        /* --- FRECCIA NOTHING UI (7 PALLINI) --- */
        .nothing-arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), bottom 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 100;
        }

        .glyph-btn.active .nothing-arrow {
            opacity: 1;
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #FFF;
            border-radius: 50%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Posizioni freccia verso il basso (V) */
        /* Il pallino centrale (la punta) ha lo spostamento maggiore rispetto
           agli altri, sia nella posa iniziale sia nel delta verso in-banyue,
           cosicché durante il flip percorra più strada di tutti gli altri. */
        .dot:nth-child(1) {
            transform: translate(-24px, -8px);
        }

        .dot:nth-child(2) {
            transform: translate(-16px, -4px);
        }

        .dot:nth-child(3) {
            transform: translate(-8px, 0px);
        }

        .dot:nth-child(4) {
            transform: translate(0px, 4px);
        }

        /* Punta (percorre più strada) */
        .dot:nth-child(5) {
            transform: translate(8px, 0px);
        }

        .dot:nth-child(6) {
            transform: translate(16px, -4px);
        }

        .dot:nth-child(7) {
            transform: translate(24px, -8px);
        }

        /* Freccia invertita in alto (Pagina Banyue) */
        .nothing-arrow.in-banyue {
            bottom: calc(100vh - 50px);
        }

        .nothing-arrow.in-banyue .dot:nth-child(1) {
            transform: translate(-24px, 8px);
        }

        .nothing-arrow.in-banyue .dot:nth-child(2) {
            transform: translate(-16px, 4px);
        }

        .nothing-arrow.in-banyue .dot:nth-child(3) {
            transform: translate(-8px, 0px);
        }

        .nothing-arrow.in-banyue .dot:nth-child(4) {
            transform: translate(0px, -4px);
        }

        /* Punta inverte in alto */
        .nothing-arrow.in-banyue .dot:nth-child(5) {
            transform: translate(8px, 0px);
        }

        .nothing-arrow.in-banyue .dot:nth-child(6) {
            transform: translate(16px, 4px);
        }

        .nothing-arrow.in-banyue .dot:nth-child(7) {
            transform: translate(24px, 8px);
        }

        /* --- PAGINA 2: BANYUE --- */
        .page-2 {
            opacity: 0;
            pointer-events: none;
            transform: translateY(100vh);
        }

        .page-2.active-page {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* Gradiente ed Effetto Disegno di Banyue SVG */
        .banyue-svg path {
            stroke: url(#banyueGradient) !important;
            stroke-dasharray: var(--len, 2000);
            stroke-dashoffset: var(--len, 2000);
            /* Inizialmente nascosto */
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* L'animazione parte solo quando scatta la classe .drawn (dopo lo swipe) */
        .banyue-svg.drawn path {
            stroke-dashoffset: 0;
        }

        /* Layer Sfondo: 8 SVG in Cerchio */
        .background-ring {
            width: 100%;
            height: 100%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            animation: rotateRing 25s cubic-bezier(0.92, 0.29, 0.04, 0.73) infinite;
            pointer-events: none;
        }

        .bg-element {
            --ring-radius: calc(var(--ring-size) * 0.38);
            --elem-size: calc(var(--ring-size) * 0.2);
            position: absolute;
            top: calc(50% - (var(--elem-size) / 2));
            left: calc(50% - (var(--elem-size) / 2));
            width: var(--elem-size);
            height: var(--elem-size);
            opacity: 0.6;
            transition: opacity 0.6s ease;
        }

        .bg-element svg {
            width: 100%;
            height: 100%;
            display: block;

            animation: counterRotate 10s ease-in-out infinite;
            animation-delay: var(--rot-delay, 0s);
            animation-direction: alternate;
        }

        /* Il pallino/ball riprende il gradiente di Banyue, più tenue */
        .bg-element svg path {
            fill: url(#banyueGradient);
            stroke: none;
            transform: scale(0.75);
            transform-origin: center;
            transform-box: fill-box;
        }

        /* Disposizione degli 8 elementi in cerchio */
        .bg-element:nth-child(1) {
            transform: rotate(0deg) translate(var(--ring-radius)) rotate(0deg);
        }

        .bg-element:nth-child(2) {
            transform: rotate(-45deg) translate(var(--ring-radius)) rotate(45deg);
        }

        .bg-element:nth-child(3) {
            transform: rotate(-90deg) translate(var(--ring-radius)) rotate(90deg);
        }

        .bg-element:nth-child(4) {
            transform: rotate(-135deg) translate(var(--ring-radius)) rotate(135deg);
        }

        .bg-element:nth-child(5) {
            transform: rotate(-180deg) translate(var(--ring-radius)) rotate(180deg);
        }

        .bg-element:nth-child(6) {
            transform: rotate(-225deg) translate(var(--ring-radius)) rotate(225deg);
        }

        .bg-element:nth-child(7) {
            transform: rotate(-270deg) translate(var(--ring-radius)) rotate(270deg);
        }

        .bg-element:nth-child(8) {
            transform: rotate(-315deg) translate(var(--ring-radius)) rotate(315deg);
        }

        .bg-element:nth-child(1) svg {
            --rot-delay: -3.4s;
            --rot-duration: 23.5s;
        }

        .bg-element:nth-child(2) svg {
            --rot-delay: -14.8s;
            --rot-duration: 26.2s;
        }

        .bg-element:nth-child(3) svg {
            --rot-delay: -8.1s;
            --rot-duration: 24.0s;
        }

        .bg-element:nth-child(4) svg {
            --rot-delay: -19.5s;
            --rot-duration: 27.1s;
        }

        .bg-element:nth-child(5) svg {
            --rot-delay: -1.2s;
            --rot-duration: 22.8s;
        }

        .bg-element:nth-child(6) svg {
            --rot-delay: -11.0s;
            --rot-duration: 25.5s;
        }

        .bg-element:nth-child(7) svg {
            --rot-delay: -6.7s;
            --rot-duration: 23.9s;
        }

        .bg-element:nth-child(8) svg {
            --rot-delay: -16.3s;
            --rot-duration: 26.8s;
        }

        .ring-mask-wrapper {
            /* Unifichiamo la dimensione dell'anello */
            --ring-size: clamp(450px, 80vmin, 520px);

            position: absolute;
            width: var(--ring-size);
            height: var(--ring-size);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            pointer-events: none;

            /* SPOSTAMENTO VERSO L'ALTO:
       Aumenta o diminuisci i pixel (-60px, -100px, ecc.) per alzare l'anello a tuo piacimento */
            transform: translateY(-180px);

            /* MASCHERA POLIGONALE FISSA */
            clip-path: polygon(100% 0, 0 0, 0 75%, 50% 20%, 100% 75%);
        }

        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counterRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        /* --- TRAGITTO AD ANELLO DELLE PALLINE (TRAIETTORIA DISEGNO) --- */
        @keyframes ballEntryTrajectory {
            0% {
                /* Partenza dal basso, allineate in colonna */
                transform: translate(0, 1500px) scale(0.3);
                opacity: 0;
            }

            45% {
                /* Salita verticale sparata verso l'alto */
                transform: translate(0, -140px) scale(1);
                opacity: 1;
            }

            65% {
                /* Curva in alto a destra (il cappio/loop del disegno) */
                transform: translate(65px, -90px) scale(1);
            }

            80% {
                /* Discesa interna alla curva */
                transform: translate(20px, -30px) scale(1);
            }

            100% {
                /* Assestamento nella posizione finale sul cerchio */
                transform: var(--final-pos);
                opacity: 1;
            }
        }

        /* Posizioni finali di ciascun elemento nell'anello */
        .bg-element:nth-child(1) {
            --final-pos: rotate(0deg) translate(var(--ring-radius)) rotate(0deg);
        }

        .bg-element:nth-child(2) {
            --final-pos: rotate(-45deg) translate(var(--ring-radius)) rotate(45deg);
        }

        .bg-element:nth-child(3) {
            --final-pos: rotate(-90deg) translate(var(--ring-radius)) rotate(90deg);
        }

        .bg-element:nth-child(4) {
            --final-pos: rotate(-135deg) translate(var(--ring-radius)) rotate(135deg);
        }

        .bg-element:nth-child(5) {
            --final-pos: rotate(-180deg) translate(var(--ring-radius)) rotate(180deg);
        }

        .bg-element:nth-child(6) {
            --final-pos: rotate(-225deg) translate(var(--ring-radius)) rotate(225deg);
        }

        .bg-element:nth-child(7) {
            --final-pos: rotate(-270deg) translate(var(--ring-radius)) rotate(270deg);
        }

        .bg-element:nth-child(8) {
            --final-pos: rotate(-315deg) translate(var(--ring-radius)) rotate(315deg);
        }

        /* --- GESTIONE STATO DI ENTRATA (.entry-animating) --- */
        /* Durante l'entrata: nessuna rotazione continua dell'anello */
        .page-2.entry-animating .background-ring {
            animation: none !important;
        }

        /* Attivazione traiettoria a cascata (sfalsata di 0.09s tra ogni pallina) */
        .page-2.entry-animating .bg-element {
            animation: ballEntryTrajectory 1.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: calc(var(--idx, 0) * 0.09s);
        }

        .bg-element:nth-child(1) {
            --idx: 0;
        }

        .bg-element:nth-child(2) {
            --idx: 1;
        }

        .bg-element:nth-child(3) {
            --idx: 2;
        }

        .bg-element:nth-child(4) {
            --idx: 3;
        }

        .bg-element:nth-child(5) {
            --idx: 4;
        }

        .bg-element:nth-child(6) {
            --idx: 5;
        }

        .bg-element:nth-child(7) {
            --idx: 6;
        }

        .bg-element:nth-child(8) {
            --idx: 7;
        }

        /* La maschera e l'SVG Banyue rimangono nascosti fino a completamento */
        .ring-mask-wrapper {
            clip-path: none;
            /* Disattivata inizialmente per mostrare le palline che salgono dal basso */
            transition: clip-path 0.4s ease;
        }

        .banyue-svg {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* --- STATO FINALE (.entry-complete) --- */
        /* Attiva la maschera e mostra l'SVG Banyue */
        .page-2.entry-complete .ring-mask-wrapper {
            clip-path: polygon(100% 0, 0 0, 0 75%, 50% 20%, 100% 75%);
        }

        .page-2.entry-complete .banyue-svg {
            opacity: 1;
        }

        /* Ripristina la rotazione continua dell'anello */
        .page-2.entry-complete .background-ring {
            animation: rotateRing 25s linear infinite;
        }

        /* #banyueContainer va reso un elemento posizionato con z-index
           esplicito: senza questo, essendo un figlio "static" di un flex
           container, verrebbe dipinto PRIMA di .background-ring (che è
           position:absolute con z-index positivo) e quindi finirebbe
           dietro l'anello invece che davanti. */
        #banyueContainer {
            position: relative;
            z-index: 2;
            /* Sopra la griglia ruotante */
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease forwards;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* --- PAGINA 3: MIYABI (TIMER) --- */
        /* Banyue esce verso sinistra quando si scorre su Miyabi */
        .page-2.side-exit {
            transform: translateX(-100vw);
        }

        /* L'opacità si azzera solo a fine transizione, così l'uscita resta visibile */
        .page-3 {
            opacity: 0;
            pointer-events: none;
            transform: translateX(100vw);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0s linear 0.8s;
        }

        .page-3.active-page {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .page-3.exit-down {
            transform: translateY(100vh);
        }

        .miyabi-layout {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            /* Nessun margine laterale: la scena è ritagliata dal fotogramma e continua oltre i bordi */
            padding: 72px 0 calc(32px + env(safe-area-inset-bottom));
        }

        #miyabiContainer {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .miyabi-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .miyabi-svg path {
            stroke: url(#miyabiGradient) !important;
            stroke-dasharray: var(--len, 2000);
            stroke-dashoffset: var(--len, 2000);
            transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .miyabi-svg .miyabi-blade path {
            stroke: url(#miyabiBladeGradient) !important;
        }
        .miyabi-svg.drawn path {
            stroke-dashoffset: 0;
        }

        .miyabi-timer {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .page-3.active-page .miyabi-timer {
            opacity: 1;
            transition-delay: 0.5s;
        }

        /* Display a matrice di punti (stile Nothing) */
        .miyabi-digits {
            width: min(78vw, 300px);
            height: auto;
            display: block;
        }

        .miyabi-digits circle {
            fill: #1D1D1D;
            transition: fill 0.15s ease;
        }

        .miyabi-digits circle.on {
            fill: #FFFFFF;
        }

        .miyabi-digits.done circle.on {
            animation: miyabiBlink 1s steps(1) infinite;
        }

        @keyframes miyabiBlink {
            50% {
                fill: #1D1D1D;
            }
        }

        .miyabi-controls {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .miyabi-ctl {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid #333333;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.3s ease;
        }

        .miyabi-ctl:active {
            background-color: #151515;
        }

        .miyabi-ctl.primary {
            width: 68px;
            height: 68px;
            border-color: #7FE7FF;
        }

        .miyabi-ctl.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .miyabi-ctl svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Fendente che appare quando la katana viene rinfoderata */
        .miyabi-slash {
            position: absolute;
            left: -20vw;
            top: 40%;
            width: 140vw;
            height: 2px;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(90deg, transparent, #BFF6FF 20%, #FFFFFF 50%, #BFF6FF 80%, transparent);
            box-shadow: 0 0 12px 2px rgba(127, 231, 255, 0.7);
            transform: rotate(-28deg) scaleX(0);
        }

        .miyabi-slash.slashing {
            animation: miyabiSlash 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes miyabiSlash {
            0% {
                opacity: 1;
                transform: rotate(-28deg) scaleX(0);
            }

            25% {
                opacity: 1;
                transform: rotate(-28deg) scaleX(1);
            }

            100% {
                opacity: 0;
                transform: rotate(-28deg) scaleX(1);
            }
        }

        /* Cristalli di ghiaccio che scendono sullo sfondo */
        .frost {
            position: absolute;
            top: 0;
            left: var(--x);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background-color: #BFF6FF;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            animation: frostFall var(--dur) linear infinite;
            animation-delay: var(--delay);
        }

        .page-3:not(.active-page) .frost {
            animation-play-state: paused;
        }

        @keyframes frostFall {
            0% {
                opacity: 0;
                transform: translate(0, -5vh);
            }

            10%,
            90% {
                opacity: 0.45;
            }

            100% {
                opacity: 0;
                transform: translate(var(--drift), 105vh);
            }
        }
    </style>
</head>

<body>
    <button id="btnToggle" class="glyph-btn" aria-label="Attiva/Disattiva Servizio">

        <!-- FRECCIA NOTHING (7 PALLINI) -->
        <div id="nothingArrow" class="nothing-arrow">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="dot"></span> <!-- Punta -->
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <!-- PAGINA 1: SVG PRINCIPALE -->
        <div id="page1" class="page page-1">
            <svg class="glyph-svg" viewBox="720 68 460 940" xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid meet">
                <path
                    d="M 952,974 958,974 962,978 962,979 963,980 963,981 964,982 964,987 962,989 962,990 960,992 960,993 959,994 952,994 948,990 948,989 947,988 947,980 948,979 948,978"
                    stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
                <path
                    d="M 951,974 948,977 948,979 947,980 947,988 948,989 948,991 951,994 960,994 960,993 962,991 962,990 963,989 963,988 964,987 964,982 963,981 963,980 962,979 962,977 959,974"
                    stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
                <path
                    d="M 951,835 957,835 958,836 959,836 960,837 960,838 962,840 962,934 963,935 963,949 962,950 962,952 959,955 958,955 957,956 953,956 952,955 951,955 948,952 948,951 947,950 947,895 946,842 947,841 947,839"
